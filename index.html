<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>生活榮譽競賽｜每週巡堂評分</title>
<style>
:root{--bg:#f7f4ee;--fg:#2b2723;--card:#fff;--line:#ddd4c6;--mut:#7a7064;--ok:#2f6f5e;--okbg:#e3f0ea;--bad:#b4452f;--badbg:#f8e6e1;--acc:#8a5a2b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1b18;--fg:#efe8dc;--card:#2a2622;--line:#47403a;--mut:#ab9f8f;--ok:#6fc1a8;--okbg:#24372f;--bad:#e58a74;--badbg:#3d2621;--acc:#d3a56d}}
:root[data-theme="dark"]{--bg:#1e1b18;--fg:#efe8dc;--card:#2a2622;--line:#47403a;--mut:#ab9f8f;--ok:#6fc1a8;--okbg:#24372f;--bad:#e58a74;--badbg:#3d2621;--acc:#d3a56d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:760px;margin:auto;padding:12px}
h1{font-size:18px;margin:4px 0 8px}h2{font-size:15px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>.g{flex:1;min-width:90px}
select,input{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;box-sizing:border-box;width:100%;min-height:44px}
label{font-size:12px;color:var(--mut);display:block}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:44px;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.chip{min-width:48px}.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.cls{display:flex;flex-direction:column;align-items:center;min-width:76px;line-height:1.3}
.cls small{font-size:12px;color:var(--mut)}.cls.on small{color:#fff}
.tabs button{flex:1;border-radius:0}.tabs button.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.it{position:relative;text-align:left;padding:10px 10px 10px 12px;min-height:64px}
.it.add{background:var(--okbg);border-color:var(--ok)}.it.sub{background:var(--badbg);border-color:var(--bad)}
.it b{display:block}.it span{font-size:13px;color:var(--mut)}
.cnt{position:absolute;right:8px;top:6px;font-weight:700;font-size:18px}
.minus{min-height:32px;padding:2px 10px;margin-top:4px;font-size:13px}
.total{display:flex;justify-content:space-between;gap:6px;text-align:center;margin:10px 0}
.total div{flex:1;border-radius:8px;padding:6px;background:var(--bg)}.total b{display:block;font-size:22px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.mut{color:var(--mut);font-size:13px}.st{font-size:13px}.warn{background:var(--badbg);color:var(--bad);padding:8px;border-radius:8px;font-size:14px}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:center}
.ov{overflow-x:auto}#pstage svg{width:100%;height:auto;display:block;border:1px solid var(--line)}@media print{body *{visibility:hidden}#pstage,#pstage *,#rstage,#rstage *{visibility:visible}#pstage,#rstage{position:absolute;left:0;top:0;width:100%}}.sm{min-height:36px;padding:4px 8px;font-size:13px}.sm.i{width:90px}
</style></head><body><div class="wrap" id="app"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const G=["","一","二","三","四","五","六"],AW={clean:"環境整潔獎",order:"秩序禮貌獎"},DEF=["知足","感恩","善解","包容","合心"];
const uid=()=>Math.random().toString(36).slice(2,8),$=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fd=d=>{if(!d)return"";const p=d.split("-");return+p[1]+"/"+ +p[2]};
let cfg={minRounds:3,base:0,agg:"avg",years:{}},recs={},dress={},results={},db=null,user=null,isAdmin=true,timer=null,saveSt="",dbOk=false;
let S={tab:"home",year:"",sem:"1",week:"",grade:1,cls:0,award:"clean",round:1,insp:"",aYear:""};
const LS={g(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
// ---------- storage: DB first, localStorage as offline cache ----------
async function initStore(){
  try{if(window.claude){db=wrapDb(await claude.use("db"));user=await claude.use("user");try{me=await user.id()}catch(e){}if(user){try{const c=await user.canEdit();if(c===false)isAdmin=false}catch(e){}}}}catch(e){db=null}
  const lc=LS.g("cfg"),lr=LS.g("recs")||{};dress=LS.g("dress")||{};results=LS.g("results")||{};
  if(lc)cfg=lc;recs=lr;
  if(db){try{
    const c=await db.collection("cfg").doc("main").get();if(c.exists){const d=c.data();if(d&&d.json)cfg=JSON.parse(d.json)}
    dbOk=true;}catch(e){dbOk=false}}
  const sv=LS.g("sel");if(sv)Object.assign(S,sv,{tab:"home"});
}
async function saveCfg(){audit("設定變更","cfg","main");LS.s("cfg",cfg);if(db){try{await db.collection("cfg").doc("main").set({json:JSON.stringify(cfg),updated:Date.now()});dbOk=true}catch(e){dbOk=false}}}
async function saveRec(r){
  r.rev=r.rev||[];const lv=r.rev[r.rev.length-1];if(!lv||lv.s!==r.status||JSON.stringify(lv.m)!==JSON.stringify(r.marks)){if(lv&&lv.s!==r.status)audit(r.status==="done"?"評分標記完成":"評分改回暫存","insp",r.id);r.rev.push({at:Date.now(),by:S.insp||"",s:r.status,m:{...r.marks}});if(r.rev.length>30)r.rev.shift()}
  r.updated=Date.now();recs[r.id]=r;LS.s("recs",recs);saveSt="儲存中…";paintSt();
  if(db){try{await db.collection("insp").doc(r.id).set(r);dbOk=true;saveSt=""}catch(e){dbOk=false;saveSt="資料庫寫入失敗，已暫存本機"}}
  else saveSt="已暫存本機（尚未連線資料庫）";
  paintSt();
}
const paintSt=()=>{const e=$("#st");if(e)e.textContent=saveSt};
// ---------- helpers ----------
const Y=()=>cfg.years[S.year],weeks=()=>(Y()?.weeks||[]).filter(w=>w.sem==S.sem).sort((a,b)=>a.no-b.no);
const classes=g=>Y()?.classes?.[g]||[],rub=a=>Y()?.rubric?.[a]||[];
const rid=(w,g,c,a,r)=>`y${S.year}_s${S.sem}_w${w}_g${g}_c${c}_${a}_r${r}`;
const getRec=(g,c,a,r)=>recs[rid(S.week,g,c,a,r)];
function score(r,a){let ad=0,sb=0;for(const it of rub(a)){const n=r.marks?.[it.id]||0;if(it.type==="add")ad+=it.pts*n;else sb+=it.pts*n}return{ad,sb,net:+cfg.base+ad-sb}}
function weekly(g,c,a){const v=Object.values(recs).filter(r=>r.week===S.week&&r.year===S.year&&r.sem===S.sem&&r.grade==g&&r.cls==c&&r.award===a&&r.status==="done").map(r=>score(r,a).net);
  if(!v.length)return null;return cfg.agg==="sum"?v.reduce((x,y)=>x+y,0):cfg.agg==="max"?Math.max(...v):v.reduce((x,y)=>x+y,0)/v.length}
const rounds=()=>{let m=cfg.minRounds;Object.values(recs).forEach(r=>{if(r.week===S.week&&r.year===S.year&&r.sem===S.sem)m=Math.max(m,r.round)});return Math.max(m,S.round)};
const doneN=(g,c,a)=>Object.values(recs).filter(r=>r.week===S.week&&r.year===S.year&&r.sem===S.sem&&r.grade==g&&r.cls==c&&r.award===a&&r.status==="done").length;
// ---------- render ----------
const NAVL={home:"首頁",score:"巡堂評分",dress:"服儀抽檢",rank:"本週成績",hist:"歷史紀錄",poster:"獲獎海報",stat:"學期／學年統計",admin:"行政管理後台"};
const navKeys=()=>["home","score","dress","rank","hist"].concat(isAdmin?["poster","stat","admin"]:[]);
const loaded={};let audits=LS.g("audits")||{},me="",auditList=null;
async function loadYear(y){if(!db||!y||loaded[y])return;const st={insp:recs,dress:dress,results:results};try{for(const n in st){const q=await db.query(n,"year",y);q.docs.forEach(d=>{const r=d.data();if(r&&(!st[n][d.id]||(st[n][d.id].updated||0)<(r.updated||0)))st[n][d.id]=r})}loaded[y]=1;dbOk=true}catch(e){dbOk=false}}
function audit(act,coll,id,note){const o={at:Date.now(),by:S.insp||"",uid:me,act,coll,id,note:note||""},k="a"+o.at+"_"+uid();audits[k]=o;const ks=Object.keys(audits);if(ks.length>200)delete audits[ks[0]];LS.s("audits",audits);if(db)db.collection("audit").doc(k).set(o).catch(()=>{})}
const stLabel=r=>/^(填寫中|儲存中)|失敗|暫存本機/.test(saveSt)?saveSt:!r.updated?"尚未填寫":r.status==="done"?"已完成":"已儲存 "+new Date(r.updated).toLocaleTimeString("zh-TW",{hour12:false});
function auditCard(){return`<div class="card"><h2>操作紀錄（最近 50 筆）</h2><button class="sm" data-a="auditload">載入／重新整理</button>${auditList?`<div class="ov"><table style="white-space:nowrap"><tr><th>時間</th><th>操作者</th><th>動作</th><th>對象</th></tr>${auditList.map(o=>`<tr><td>${fmtT(o.at)}</td><td>${esc(o.by||o.uid||"—")}</td><td>${esc(o.act)}</td><td>${esc(o.id)}</td></tr>`).join("")}</table></div>`:""}</div>`}
let online=navigator.onLine,pend=LS.g("pend")||{};
const pcount=()=>Object.keys(pend).length;
const netTxt=()=>!db?`<b class="w">未登入或未連線資料庫</b>資料只存在本機，請登入 claude.ai 後再評分`:!online?`<b class="w">離線中</b>評分已暫存在本機${pcount()?`（${pcount()} 筆待同步）`:""}，恢復連線後自動同步`:pcount()?`<b class="w">${pcount()} 筆待同步</b><button class="sm" data-a="sync">立即同步</button>`:`<span class="okt">資料已同步</span>`;
const paintNet=()=>document.querySelectorAll(".net").forEach(e=>e.innerHTML=netTxt());
let ft=0;const setP=(k,on)=>{if(on){pend[k]=1;if(!ft)ft=setTimeout(()=>{ft=0;flush()},15000)}else delete pend[k];LS.s("pend",pend);paintNet()};
function wrapDb(raw){if(!raw)return raw;return{query:(n,f,v)=>raw.collection(n).where(f,"==",v).get(),recent:(n,k)=>raw.collection(n).orderBy(k,"desc").limit(50).get(),collection:n=>({get:()=>raw.collection(n).get(),doc:id=>({get:()=>raw.collection(n).doc(id).get(),set:async o=>{const k=n+"/"+id;if(!online){setP(k,1);throw new Error("offline")}try{await raw.collection(n).doc(id).set(o);if(pend[k])setP(k,0)}catch(e){setP(k,1);throw e}}})})}}
async function flush(){if(!db||!online)return;for(const k of Object.keys(pend)){const[n,id]=k.split("/");const o=n==="insp"?recs[id]:n==="dress"?dress[id]:n==="results"?results[id]:n==="cfg"?{json:JSON.stringify(cfg),updated:Date.now()}:n==="audit"?audits[id]:null;if(!o){setP(k,0);continue}try{await db.collection(n).doc(id).set(o)}catch(e){}}paintNet()}
window.addEventListener("online",()=>{online=true;paintNet();flush()});window.addEventListener("offline",()=>{online=false;paintNet()});
function autoWeek(){const t=new Date(),td=t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");for(const y of Object.keys(cfg.years).sort().reverse())for(const w of cfg.years[y].weeks||[])if(td>=w.start&&td<=w.end){S.year=y;S.sem=w.sem;S.week=w.id;return true}return false}
function homeView(){
  const cur=weeks().find(w=>w.id===S.week);let tot=0,dn=0,dt=0,dd=0;
  if(cur)for(let g=1;g<=6;g++)classes(g).forEach((_,c)=>{["clean","order"].forEach(a=>{tot+=cfg.minRounds;dn+=Math.min(cfg.minRounds,doneN(g,c,a))});dt++;const x=dressOf(g,c);if(x&&x.status==="done")dd++});
  const T=[["score","新增巡堂評分","選班級、點項目，自動儲存"],["dress","服儀抽檢","隨機抽項目，輸入未通過人數"],["rank","本週成績","排名與獲獎結果"],["hist","歷史紀錄","查詢以前各週成績"]];
  if(isAdmin)T.push(["admin","行政管理後台","學年、班級、週次、評分表"],["stat","學期／學年統計","獲獎次數、排行、匯出"],["poster","獲獎海報","預覽、下載、分享"]);
  return`<div class="card"><h2 style="font-size:18px;margin:0">${cur?`${esc(S.year)}學年度第${S.sem=="1"?"一":"二"}學期　第${cur.no}週（${fd(cur.start)}～${fd(cur.end)}）`:"尚未找到本週"}</h2><p class="mut" style="margin:4px 0 0">${cur?`巡堂評分完成度 ${tot?Math.round(dn/tot*100):0}%｜服儀抽檢 ${dd}／${dt} 班`:"週次由行政教師在後台設定。請先選擇週次，或請行政教師建立。"}</p></div><div class="tiles">${T.map((t,i)=>`<button class="tile ${i===0?"first":""} ${["admin","stat","poster"].includes(t[0])?"adm":""}" data-a="go" data-v="${t[0]}"><b>${t[1]}</b><span>${t[2]}</span></button>`).join("")}</div>`}
function histView(){
  const ys=Object.keys(cfg.years).sort().reverse(),Yc=cfg.years[S.year],ws=((Yc&&Yc.weeks)||[]).filter(w=>w.sem==S.sem).sort((a,b)=>b.no-a.no);
  let h=`<div class="card"><div class="row"><div class="g"><label>學年度</label><select data-c="year">${ys.map(y=>`<option ${y===S.year?"selected":""}>${y}</option>`).join("")||"<option>—</option>"}</select></div><div class="g"><label>學期</label><select data-c="sem"><option value="1" ${S.sem=="1"?"selected":""}>第一學期</option><option value="2" ${S.sem=="2"?"selected":""}>第二學期</option></select></div></div></div><div class="card">`;
  h+=ws.map(w=>{const r=results[`y${S.year}_s${S.sem}_w${w.id}`],ok=r&&r.status==="confirmed";
    const nm=k=>ok?r.snap.flatMap(x=>x.rows.filter(z=>z[k]).map(z=>G[x.g]+"年"+esc(z.n))).join("、")||"—":"";
    return`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="row" style="justify-content:space-between"><span><b>第${w.no}週</b>　${fd(w.start)}～${fd(w.end)}　${ok?'<span class="gold">已確認</span>':'<span class="mut">未確認</span>'}</span><span><button class="sm" data-a="open" data-v="rank:${w.id}">成績</button>${isAdmin&&ok?` <button class="sm" data-a="open" data-v="poster:${w.id}">海報</button>`:""}</span></div>${ok?`<div class="mut" style="margin-top:4px">環境整潔：${nm("cw")}<br>秩序禮貌：${nm("ow")}</div>`:""}</div>`}).join("")||'<p class="mut" style="margin:0">此學期尚無週次資料。</p>';
  return h+"</div>"}
function render(){
  LS.s("sel",{year:S.year,sem:S.sem,week:S.week,grade:S.grade,cls:S.cls,award:S.award,round:S.round,insp:S.insp,aYear:S.aYear});
  const yrs=Object.keys(cfg.years).sort().reverse();
  if(!isAdmin&&["poster","stat","admin"].includes(S.tab))S.tab="home";
  const nav=`<nav class="side"><div class="brand">慈濟國小<br><span>生活榮譽競賽</span></div>${navKeys().map(k=>`<button data-a="go" data-v="${k}" class="${S.tab===k?"on":""}">${NAVL[k]}</button>`).join("")}<div class="net" style="padding:8px 4px 0">${netTxt()}</div></nav>`;
  const mbar=`<div class="mbar">${S.tab!=="home"?'<button class="sm" data-a="go" data-v="home">‹ 首頁</button>':""}<b>${NAVL[S.tab]||""}</b><span class="net">${netTxt()}</span></div>`;
  const body=S.tab==="home"?homeView():S.tab==="hist"?histView():S.tab==="stat"?statView():S.tab==="admin"?admin()+auditCard():scoring(yrs,S.tab);
  $("#app").innerHTML=`<div class="shell">${nav}<main>${mbar}${body}</main></div>`;paintSt();
}
function scoring(yrs,mode){
  let h=`<div class="card"><div class="row"><div class="g"><label>學年度</label><select data-c="year">${yrs.map(y=>`<option ${y===S.year?"selected":""}>${y}</option>`).join("")||"<option>—</option>"}</select></div>
  <div class="g"><label>學期</label><select data-c="sem"><option value="1" ${S.sem=="1"?"selected":""}>第一學期</option><option value="2" ${S.sem=="2"?"selected":""}>第二學期</option></select></div>
  <div class="g" style="flex:2"><label>週次</label><select data-c="week"><option value="">請選擇</option>${weeks().map(w=>`<option value="${w.id}" ${w.id===S.week?"selected":""}>第${w.no}週 ${fd(w.start)}～${fd(w.end)}</option>`).join("")}</select></div></div></div>`;
  if(!Y()){return h+`<div class="warn">尚未建立學年度資料，請由行政教師到「後台設定」建立學年度、班級、週次與評分表。</div>`}
  const wk=weeks().find(w=>w.id===S.week);
  if(!wk)return h+`<div class="warn">請選擇週次。週次與日期由行政教師於後台設定，系統不會自行推算。</div>`;
  if(mode==="dress")return h+dressView(wk);if(mode==="rank")return h+rankView(wk);if(mode==="poster")return h+posterView(wk);
  const cl=classes(S.grade);if(S.cls>=cl.length)S.cls=0;
  h+=`<div class="card"><label>年級</label><div class="row">${[1,2,3,4,5,6].map(g=>`<button class="chip ${g===S.grade?"on":""}" data-a="grade" data-v="${g}">${G[g]}</button>`).join("")}</div>
  <label style="margin-top:8px">巡堂次數</label><div class="row">${Array.from({length:rounds()},(_,i)=>`<button class="chip ${i+1===S.round?"on":""}" data-a="round" data-v="${i+1}">第${i+1}次</button>`).join("")}<button class="chip" data-a="addround">＋</button></div>
  <div class="row tabs" style="margin-top:8px;gap:0">${Object.keys(AW).map(a=>`<button data-a="award" data-v="${a}" class="${a===S.award?"on":""}">${AW[a]}</button>`).join("")}</div>
  <label style="margin-top:8px">班級（○未評 ●暫存 ✓完成）</label><div class="row">${cl.map((n,i)=>{const r=getRec(S.grade,i,S.award,S.round);return`<button class="chip cls ${i===S.cls?"on":""}" data-a="cls" data-v="${i}">${esc(n)}<small>${!r?"○":r.status==="done"?"✓ "+score(r,S.award).net:"● 暫存"}</small></button>`}).join("")}</div></div>`;
  h+=panel(wk,cl)+progress(cl);
  return h;
}
function panel(wk,cl){
  const a=S.award,items=rub(a),r=getRec(S.grade,S.cls,a,S.round)||{marks:{},status:"",date:"",inspector:S.insp};
  let h=`<div class="card"><h2>${G[S.grade]}年${esc(cl[S.cls])}班｜${AW[a]}｜第${S.round}次巡堂</h2>`;
  if(!items.length)return h+`<div class="warn">${AW[a]}尚未建立評分項目。請行政教師依學校正式評分表於「後台設定」輸入。</div></div>`;
  const today=new Date().toISOString().slice(0,10),dt=r.date||(today>=wk.start&&today<=wk.end?today:wk.start),sc=score(r,a);
  h+=`<div class="row"><div class="g"><label>巡堂教師</label><input data-c="insp" value="${esc(r.inspector||S.insp)}" placeholder="姓名"></div><div class="g"><label>評分日期</label><input type="date" data-c="date" min="${wk.start}" max="${wk.end}" value="${dt}"></div></div>`;
  for(const t of["add","sub"]){const l=items.filter(i=>i.type===t);if(!l.length)continue;
    h+=`<h2 style="margin-top:12px">${t==="add"?"加分項目":"扣分項目"}</h2><div class="items">${l.map(i=>{const n=r.marks?.[i.id]||0;return`<div><button class="it ${t}" style="width:100%" data-a="mark" data-v="${i.id}"><b>${esc(i.name)}</b><span>${t==="add"?"＋":"－"}${i.pts} 分／次</span>${n?`<div class="cnt">×${n}</div>`:""}</button>${n?`<button class="minus" data-a="unmark" data-v="${i.id}">減一次</button>`:""}</div>`}).join("")}</div>`}

function secSum(d){const gs=[...new Set(d.rows.map(x=>x.g))],ct=(l,k)=>l.reduce((s,x)=>s+x[k],0),cw=(l,k)=>l.filter(x=>x[k]>0).length;

  else if(a==="csv"||a==="xl"){exportStat(a);return}
  else if(a==="pdl"||a==="pshare"||a==="pprint"){const wk=weeks().find(w=>w.id===S.week);if(!wk)return;const d=posterData(wk);if(!d.ok)return alert("請先到「排名獲獎」由行政教師確認本週結果");if(a==="pprint"){window.print();return}
    audit("下載海報","results",resId());const fn=`生活榮譽競賽獲獎_${d.year}學年第${d.sem}學期第${d.week}週.png`;(async()=>{try{const b=await pngBlob(d),fl=new File([b],fn,{type:"image/png"});if(a==="pshare"&&navigator.canShare&&navigator.canShare({files:[fl]})){await navigator.share({files:[fl]});return}
      const dl=window.claude&&await claude.use("downloads");if(!dl)return alert("此環境無法下載，請改用列印存成 PDF");await dl.save({filename:fn,data:b});if(a==="pshare")alert("圖片已儲存，請從 LINE 選取此圖片傳送")}catch(err){alert("下載失敗，請再試一次")}})();return}
  else if(a==="phist"){const r=results[v];if(r){S.year=r.year;S.sem=r.sem;S.week=r.week}}
  else if(a==="rconfirm"){const by=S.insp||prompt("請輸入確認者姓名");if(!by)return;S.insp=by.trim();const all=calcAll(),n=all.reduce((s,x)=>s+x.w.length,0);if(!confirm(n?`尚有 ${n} 項資料缺漏或待抽檢，缺漏班級不會進入排名。仍要確認本週結果嗎？`:"確認本週排名與獲獎結果？"))return;const o=results[resId()];saveRes({id:resId(),year:S.year,sem:S.sem,week:S.week,status:"confirmed",by:S.insp,at:Date.now(),sig:sigOf(all),snap:snapOf(all),log:[...(o?o.log:[]),{at:Date.now(),by:S.insp,act:"確認"}]});return}
  else if(a==="rreopen"){const o=results[resId()],by=S.insp||prompt("請輸入操作者姓名");if(!o||!by||!confirm("取消確認後，本週結果回到未確認狀態。確定？"))return;S.insp=by.trim();o.status="open";o.log.push({at:Date.now(),by:S.insp,act:"取消確認"});saveRes(o);return}
  else if(a==="draw"){const by=S.insp||prompt("請輸入正導護教師姓名");if(!by)return;S.insp=by.trim();if(dressOf(S.grade,S.cls))return render();const x=new Uint32Array(1);crypto.getRandomValues(x);saveDress({id:did(S.grade,S.cls),year:S.year,sem:S.sem,week:S.week,grade:S.grade,cls:S.cls,clsName:classes(S.grade)[S.cls],item:DRESS[x[0]%DRESS.length],count:null,delta:null,status:"drawn",by:S.insp,drawnAt:Date.now(),log:[]});return}
  else if(a==="dsave"){const r=dressOf(S.grade,S.cls),n=parseInt($("#dcount").value);if(!r||!(n>=0&&n<=99))return alert("請輸入未通過人數（0～99 的整數）");if(!S.insp)return alert("請先輸入正導護教師姓名");if(!confirm(`抽檢項目：${r.item}\n未通過人數：${n} 人\n加減分：${fmtD(dscore(n))}\n儲存後即鎖定，確定？`))return;if(r.count!==null)r.log.push({at:Date.now(),by:S.insp,act:"修正",from:r.count,to:n});r.count=n;r.delta=dscore(n);r.status="done";r.doneAt=Date.now();r.by=S.insp;saveDress(r);return}
  else if(a==="unlock"){const r=dressOf(S.grade,S.cls),by=S.insp||prompt("請輸入操作者姓名");if(!r||!by||!confirm("解除鎖定後可修正未通過人數（抽檢項目不變），並記錄操作者與時間。確定？"))return;S.insp=by.trim();r.log.push({at:Date.now(),by:S.insp,act:"解除鎖定",from:r.count});r.status="unlocked";saveDress(r);return}
  else if(a==="testitems"){if(!y)return;y.rubric.clean=[{id:uid(),name:"(測試)地面乾淨",type:"add",pts:1},{id:uid(),name:"(測試)地面有垃圾",type:"sub",pts:1}];y.rubric.order=[{id:uid(),name:"(測試)隊伍整齊",type:"add",pts:1},{id:uid(),name:"(測試)喧嘩吵鬧",type:"sub",pts:1}];saveCfg()}
  render();
});
document.addEventListener("change",e=>{
  const t=e.target,c=t.dataset.c;if(!c)return;if(c==="year"||c==="sy")loadYear(t.value).then(render);const y=cfg.years[S.aYear];
  if(c==="year"){S.year=t.value;S.week=""}else if(c==="sem"){S.sem=t.value;S.week=""}else if(c==="week")S.week=t.value;
  else if(c==="aYear")S.aYear=t.value;
  else if(c==="insp"){S.insp=t.value.trim();const r=curRec();if(Object.keys(r.marks).length||recs[r.id]){r.inspector=S.insp;commit(r)}return}
  else if(c==="date"){const r=curRec();r.date=t.value;if(Object.keys(r.marks).length||recs[r.id])commit(r);return}
  else if(c==="sy"||c==="ss"||c==="sg"||c==="q"||c==="so"){S[c]=t.value}
  else if(c==="school"){cfg.school=t.value.trim();saveCfg()}
  else if(c==="logo"){const f=t.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,240/Math.max(im.width,im.height)),c2=document.createElement("canvas");c2.width=Math.round(im.width*k);c2.height=Math.round(im.height*k);c2.getContext("2d").drawImage(im,0,0,c2.width,c2.height);cfg.logo=c2.toDataURL("image/png");saveCfg();render()};im.src=fr.result};fr.readAsDataURL(f);return}
  else if(c==="dinsp"){S.insp=t.value.trim()}
  else if(c==="minRounds"){cfg.minRounds=Math.max(1,+t.value||3);saveCfg()}else if(c==="base"){cfg.base=+t.value||0;saveCfg()}else if(c==="agg"){cfg.agg=t.value;saveCfg()}
  else if(c==="ccount"){const l=y.classes[t.dataset.g],n=+t.value;if(n<l.length&&!confirm("減少班級數只會隱藏最後一班，已存紀錄仍保留。確定？"))return render();while(l.length<n)l.push(DEF[l.length]||"");l.length=n;saveCfg()}
  else if(c==="cname"){y.classes[t.dataset.g][t.dataset.i]=t.value.trim();saveCfg()}
  render();
});
(async()=>{await initStore();const ys=Object.keys(cfg.years).sort();if(!cfg.years[S.year])S.year=ys.pop()||"";if(!weeks().some(w=>w.id===S.week))S.week="";
  if(!S.week)autoWeek();await loadYear(S.year);flush();if(!Object.keys(cfg.years).length)S.tab="admin";render()})();
</script></body></html>
