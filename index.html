<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>慈濟國小｜生活榮譽競賽線上評分與管理系統</title>
<style>
:root{
  --bg:#f7f4ee;--fg:#2b2723;--card:#ffffff;--line:#ddd4c6;--mut:#7a7064;
  --ok:#2f6f5e;--okbg:#e3f0ea;--bad:#b4452f;--badbg:#f8e6e1;
  --acc:#8a5a2b;--gold:#9c6f16;--goldbg:#fbf3df;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1e1b18;--fg:#efe8dc;--card:#2a2622;--line:#47403a;--mut:#ab9f8f;
    --ok:#6fc1a8;--okbg:#24372f;--bad:#e58a74;--badbg:#3d2621;
    --acc:#d3a56d;--gold:#e8bf4a;--goldbg:#362e1e
  }
}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:820px;margin:auto;padding:12px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{height:40px;width:auto;object-fit:contain}
.brand h1{font-size:17px;margin:0;font-weight:900;color:var(--acc)}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav button{min-height:38px;padding:6px 10px;font-size:14px;border-radius:8px}
.nav button.on{background:var(--ok);color:#fff;border-color:var(--ok);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.g{flex:1;min-width:110px}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:2px}
input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-height:42px}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:42px;cursor:pointer}
button.pri{background:var(--ok);color:#fff;border-color:var(--ok);font-weight:700}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.it{position:relative;text-align:left;padding:10px 32px 10px 10px}
.it.add{background:var(--okbg);border-color:var(--ok)}
.it.sub{background:var(--badbg);border-color:var(--bad)}
.it b{display:block}.it span{font-size:13px;color:var(--mut)}
.cnt{position:absolute;right:8px;top:6px;font-weight:900;font-size:18px}
.total{display:flex;gap:8px;text-align:center;margin:12px 0}
.total div{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
.total b{display:block;font-size:20px}
.mut{color:var(--mut);font-size:13px}
.okt{color:var(--ok);font-weight:700;font-size:13px}
.warn{background:var(--badbg);color:var(--bad);border:1px solid var(--bad);border-radius:8px;padding:10px;font-size:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:7px 4px;text-align:center}
th{background:var(--bg)}
.ov{overflow-x:auto}
.sm{min-height:36px;padding:4px 10px;font-size:13px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const DEFAULT_GAS_URL = "https://github.com/tzosa-debug/tzuchi-honor/blob/main/index.html";
const G = ["", "一", "二", "三", "四", "五", "六"];
const AW = { clean: "環境整潔獎", order: "秩序禮貌獎" };
const DEF = ["知足", "感恩", "善解", "包容", "合心"];
const DRESS = ["領結", "髮飾", "皮帶", "學號未繡", "鞋子／服裝", "口罩", "手帕", "衛生紙", "頭髮", "服裝儀容不整齊", "指甲"];
const uid = () => Math.random().toString(36).slice(2, 8);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fd = d => { if (!d) return ""; const p = d.split("-"); return +p[1] + "/" + +p[2]; };

const LS = {
  g(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  s(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

let cfg = {
  gasUrl: DEFAULT_GAS_URL,
  minRounds: 3,
  base: 80,
  agg: "avg",
  school: "臺南市私立慈濟高級中學國民小學部",
  years: {}
};
let recs = {}, dress = {}, results = {};
let S = { tab: "score", year: "115", sem: "1", week: "", grade: 1, cls: 0, award: "clean", round: 1, insp: "" };
let syncMsg = "尚未同步";
let saveTimer = null;

function ensureDefaultYear() {
  if (!cfg.years["115"]) {
    cfg.years["115"] = {
      classes: Object.fromEntries([1, 2, 3, 4, 5, 6].map(g => [g, [...DEF]])),
      weeks: [
        { id: "w115_1_13", sem: "1", no: 13, start: "2026-11-23", end: "2026-11-27", duty: "甘芳璇" }
      ],
      rubric: {
        clean: [
          { id: "c1", name: "教室地面整潔", type: "add", pts: 1 },
          { id: "c2", name: "掃具擺放整齊", type: "add", pts: 1 },
          { id: "c3", name: "地面有垃圾", type: "sub", pts: 1 }
        ],
        order: [
          { id: "o1", name: "上下樓梯安靜", type: "add", pts: 1 },
          { id: "o2", name: "主動問好有禮貌", type: "add", pts: 1 },
          { id: "o3", name: "走廊奔跑喧嘩", type: "sub", pts: 1 }
        ]
      }
    };
  }
  if (!cfg.gasUrl) cfg.gasUrl = DEFAULT_GAS_URL;
  if (!S.week && cfg.years["115"]?.weeks?.length) {
    S.week = cfg.years["115"].weeks[0].id;
  }
}

function saveLocalAll() {
  LS.s("tz_cfg", cfg);
  LS.s("tz_recs", recs);
  LS.s("tz_dress", dress);
  LS.s("tz_results", results);
  LS.s("tz_sel", S);
}

async function pullFromGas(showAlert = false) {
  const url = (cfg.gasUrl || "").trim();
  if (!url) { syncMsg = "未設定雲端同步網址（僅存本機）"; render(); return; }
  syncMsg = "正在從雲端讀取…";
  render();
  try {
    const res = await fetch(url, { method: "GET" });
    const data = await res.json();
    if (data && typeof data === "object") {
      if (data.cfg && data.cfg.years) cfg = { ...cfg, ...data.cfg, gasUrl: url };
      if (data.recs) recs = data.recs;
      if (data.dress) dress = data.dress;
      if (data.results) results = data.results;
      ensureDefaultYear();
      saveLocalAll();
      syncMsg = "✓ 已從雲端同步（" + new Date().toLocaleTimeString("zh-TW", { hour12: false }) + "）";
      if (showAlert) alert("雲端連線成功，已讀取最新資料！");
    }
  } catch (err) {
    syncMsg = "⚠ 雲端讀取失敗（已保留本機資料，請確認登入權限或部署設定）";
    if (showAlert) alert("無法讀取雲端資料：\n" + err.message + "\n\n請確認已登入學校 Google 帳號，且 Apps Script 已部署為網頁應用程式（/exec）。");
  }
  render();
}

async function pushToGas(showAlert = false) {
  saveLocalAll();
  const url = (cfg.gasUrl || "").trim();
  if (!url) { syncMsg = "未設定雲端同步網址（已存本機）"; render(); return; }
  syncMsg = "正在寫入雲端…";
  render();
  try {
    const payload = { cfg, recs, dress, results, updatedAt: Date.now() };
    await fetch(url, {
      method: "POST",
      mode: "no-cors",
      body: JSON.stringify(payload)
    });
    syncMsg = "✓ 已送出同步至雲端（" + new Date().toLocaleTimeString("zh-TW", { hour12: false }) + "）";
    if (showAlert) alert("已送出資料至 Google Apps Script 雲端端點！");
  } catch (err) {
    syncMsg = "⚠ 雲端同步失敗（已暫存本機）";
    if (showAlert) alert("寫入失敗：" + err.message);
  }
  render();
}

function scheduleAutoSave() {
  saveLocalAll();
  syncMsg = "已存本機，準備同步雲端…";
  render();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { pushToGas(false); }, 500);
}

const Y = () => cfg.years[S.year];
const weeks = () => (Y()?.weeks || []).filter(w => w.sem == S.sem).sort((a, b) => a.no - b.no);
const classes = g => Y()?.classes?.[g] || [];
const rub = a => Y()?.rubric?.[a] || [];
const rid = (w, g, c, a, r) => `y${S.year}_s${S.sem}_w${w}_g${g}_c${c}_${a}_r${r}`;
const getRec = (g, c, a, r) => recs[rid(S.week, g, c, a, r)];
const did = (g, c) => `y${S.year}_s${S.sem}_w${S.week}_g${g}_c${c}`;
const dressOf = (g, c) => dress[did(g, c)];
const dscore = n => n === 0 ? 2 : n === 1 ? 1 : n <= 3 ? 0 : n <= 5 ? -1 : -2;
const fmtD = d => d > 0 ? "+" + d : "" + d;

function score(r, a) {
  let ad = 0, sb = 0;
  for (const it of rub(a)) {
    const n = r.marks?.[it.id] || 0;
    if (it.type === "add") ad += it.pts * n;
    else sb += it.pts * n;
  }
  return { ad, sb, net: +cfg.base + ad - sb };
}

function weekly(g, c, a) {
  const v = Object.values(recs)
    .filter(r => r.week === S.week && r.year === S.year && r.sem === S.sem && r.grade == g && r.cls == c && r.award === a && r.status === "done")
    .map(r => score(r, a).net);
  if (!v.length) return null;
  if (cfg.agg === "sum") return v.reduce((x, y) => x + y, 0);
  if (cfg.agg === "max") return Math.max(...v);
  return v.reduce((x, y) => x + y, 0) / v.length;
}

function curRec() {
  const id = rid(S.week, S.grade, S.cls, S.award, S.round);
  return recs[id] || {
    id, year: S.year, sem: S.sem, week: S.week,
    grade: S.grade, cls: S.cls, clsName: classes(S.grade)[S.cls],
    award: S.award, round: S.round, marks: {}, status: "draft",
    inspector: S.insp, date: ""
  };
}

function render() {
  saveLocalAll();
  const wk = weeks().find(w => w.id === S.week) || weeks()[0];
  if (wk && !S.week) S.week = wk.id;

  let h = `<header>
    <div class="brand">
      ${cfg.logo ? `<img src="${cfg.logo}" alt="校徽">` : ""}
      <h1>慈濟國小｜生活榮譽競賽</h1>
    </div>
    <div class="nav">
      <button class="${S.tab === "score" ? "on" : ""}" data-a="tab" data-v="score">巡堂評分</button>
      <button class="${S.tab === "dress" ? "on" : ""}" data-a="tab" data-v="dress">服儀抽檢</button>
      <button class="${S.tab === "rank" ? "on" : ""}" data-a="tab" data-v="rank">本週成績</button>
      <button class="${S.tab === "admin" ? "on" : ""}" data-a="tab" data-v="admin">行政管理後台</button>
    </div>
  </header>
  <div class="card" style="padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
    <span class="${syncMsg.startsWith("✓") ? "okt" : "mut"}">${esc(syncMsg)}</span>
    <div class="row" style="gap:6px">
      <button class="sm" data-a="pull">讀取雲端</button>
      <button class="sm pri" data-a="push">立即同步</button>
    </div>
  </div>`;

  if (S.tab === "admin") {
    $("#app").innerHTML = h + adminTab();
    return;
  }

  const yrs = Object.keys(cfg.years).sort().reverse();
  h += `<div class="card"><div class="row">
    <div class="g"><label>學年度</label><select data-c="year">${yrs.map(y => `<option value="${y}" ${y === S.year ? "selected" : ""}>${y}學年度</option>`).join("")}</select></div>
    <div class="g"><label>學期</label><select data-c="sem"><option value="1" ${S.sem == "1" ? "selected" : ""}>第一學期</option><option value="2" ${S.sem == "2" ? "selected" : ""}>第二學期</option></select></div>
    <div class="g" style="flex:2"><label>週次</label><select data-c="week">${weeks().map(w => `<option value="${w.id}" ${w.id === S.week ? "selected" : ""}>第${w.no}週（${fd(w.start)}～${fd(w.end)}）</option>`).join("")}</select></div>
  </div></div>`;

  if (!wk) {
    $("#app").innerHTML = h + `<div class="warn">目前學期尚未建立週次，請到「行政管理後台」新增週次。</div>`;
    return;
  }

  if (S.tab === "dress") $("#app").innerHTML = h + dressTab(wk);
  else if (S.tab === "rank") $("#app").innerHTML = h + rankTab(wk);
  else $("#app").innerHTML = h + scoreTab(wk);
}

function scoreTab(wk) {
  const cl = classes(S.grade);
  if (S.cls >= cl.length) S.cls = 0;
  const r = curRec();
  const items = rub(S.award);
  const sc = score(r, S.award);

  let h = `<div class="card">
    <label>年級</label>
    <div class="row">${[1, 2, 3, 4, 5, 6].map(g => `<button class="chip ${g === S.grade ? "on" : ""}" data-a="grade" data-v="${g}">${G[g]}年級</button>`).join("")}</div>
    <label style="margin-top:8px">巡堂次數</label>
    <div class="row">${[1, 2, 3, 4].map(n => `<button class="chip ${n === S.round ? "on" : ""}" data-a="round" data-v="${n}">第${n}次</button>`).join("")}</div>
    <label style="margin-top:8px">獎項</label>
    <div class="row">${Object.keys(AW).map(a => `<button class="chip ${a === S.award ? "on" : ""}" data-a="award" data-v="${a}">${AW[a]}</button>`).join("")}</div>
    <label style="margin-top:8px">班級</label>
    <div class="row">${cl.map((n, i) => {
      const rec = getRec(S.grade, i, S.award, S.round);
      const st = !rec ? "○" : rec.status === "done" ? "✓ " + score(rec, S.award).net : "● 暫存";
      return `<button class="chip ${i === S.cls ? "on" : ""}" data-a="cls" data-v="${i}">${esc(n)} <small>${st}</small></button>`;
    }).join("")}</div>
  </div>`;

  h += `<div class="card">
    <h2>${G[S.grade]}年${esc(cl[S.cls])}班｜${AW[S.award]}｜第${S.round}次</h2>
    <div class="row" style="margin-bottom:10px">
      <div class="g"><label>巡堂教師</label><input data-c="insp" value="${esc(r.inspector || S.insp)}" placeholder="輸入姓名"></div>
      <div class="g"><label>評分日期</label><input type="date" data-c="date" value="${r.date || wk.start}"></div>
    </div>
    <div class="items">${items.map(it => {
      const cnt = r.marks?.[it.id] || 0;
      return `<button class="it ${it.type}" data-a="mark" data-v="${it.id}">
        <b>${esc(it.name)}</b>
        <span>${it.type === "add" ? "＋" : "－"}${it.pts} 分</span>
        ${cnt ? `<div class="cnt">×${cnt}</div>` : ""}
      </button>`;
    }).join("")}</div>
    <div class="total">
      <div>基準<b>${cfg.base}</b></div>
      <div>加分<b>＋${sc.ad}</b></div>
      <div>扣分<b>－${sc.sb}</b></div>
      <div>本次<b>${sc.net}</b></div>
    </div>
    <div class="row">
      <button class="pri" style="flex:1" data-a="done">${r.status === "done" ? "已完成（點此改回暫存）" : "標記本次完成"}</button>
      <button data-a="clear">清除</button>
    </div>
  </div>`;
  return h;
}

function dressTab(wk) {
  const cl = classes(S.grade);
  if (S.cls >= cl.length) S.cls = 0;
  const r = dressOf(S.grade, S.cls);
  let h = `<div class="card">
    <label>年級</label>
    <div class="row">${[1, 2, 3, 4, 5, 6].map(g => `<button class="chip ${g === S.grade ? "on" : ""}" data-a="grade" data-v="${g}">${G[g]}年級</button>`).join("")}</div>
    <label style="margin-top:8px">班級</label>
    <div class="row">${cl.map((n, i) => {
      const x = dressOf(S.grade, i);
      return `<button class="chip ${i === S.cls ? "on" : ""}" data-a="cls" data-v="${i}">${esc(n)} <small>${!x ? "○" : x.status === "done" ? "✓ " + fmtD(x.delta) : "●"}</small></button>`;
    }).join("")}</div>
  </div>`;

  h += `<div class="card">
    <h2>${G[S.grade]}年${esc(cl[S.cls])}班｜服裝儀容抽檢（計入秩序禮貌獎）</h2>
    <div style="margin-bottom:8px"><label>正導護教師</label><input data-c="dinsp" value="${esc(S.insp || wk.duty || "")}" placeholder="輸入正導護姓名"></div>`;
  if (!r) {
    h += `<button class="pri" style="width:100%" data-a="draw">隨機抽檢</button>`;
  } else if (r.status !== "done") {
    h += `<p>抽檢項目：<b>${esc(r.item)}</b></p>
      <div class="row"><input id="dcount" type="number" min="0" max="99" value="${r.count ?? ""}" placeholder="未通過人數" style="flex:1"><button class="pri" data-a="dsave">儲存並鎖定</button></div>`;
  } else {
    h += `<p>項目：<b>${esc(r.item)}</b>｜未通過：<b>${r.count} 人</b>｜加減分：<b>${fmtD(r.delta)}</b></p>
      <button class="sm" data-a="unlock">解除鎖定（行政）</button>`;
  }
  return h + `</div>`;
}

function rankTab(wk) {
  let h = `<div class="card"><h2>第${wk.no}週（${fd(wk.start)}～${fd(wk.end)}）各年級成績總覽</h2><p class="mut">秩序禮貌最終成績 ＝ 日常秩序成績 ＋ 服儀加減分（未抽檢顯示「待抽檢」）。</p></div>`;
  for (let g = 1; g <= 6; g++) {
    const rows = classes(g).map((n, c) => {
      const clean = weekly(g, c, "clean");
      const daily = weekly(g, c, "order");
      const dr = dressOf(g, c);
      const dd = dr && dr.status === "done";
      const fin = (daily !== null && dd) ? daily + dr.delta : null;
      return { n, clean, daily, dd, dr, fin };
    });
    h += `<div class="card"><h2>${G[g]}年級</h2><div class="ov"><table>
      <tr><th>班級</th><th>環境整潔</th><th>秩序日常</th><th>服儀加減</th><th>秩序最終</th></tr>
      ${rows.map(x => `<tr>
        <td><b>${esc(x.n)}</b></td>
        <td>${x.clean === null ? "—" : +x.clean.toFixed(2)}</td>
        <td>${x.daily === null ? "—" : +x.daily.toFixed(2)}</td>
        <td>${x.dd ? fmtD(x.dr.delta) : "待抽檢"}</td>
        <td><b>${!x.dd ? "待抽檢" : x.fin === null ? "—" : +x.fin.toFixed(2)}</b></td>
      </tr>`).join("")}
    </table></div></div>`;
  }
  return h;
}

function adminTab() {
  const y = cfg.years[S.year];
  return `<div class="card">
    <h2>一、雲端同步網址設定（Google Apps Script /exec）</h2>
    <label>Web App 網址</label>
    <input id="gasUrlInput" value="${esc(cfg.gasUrl || "")}" placeholder="https://script.google.com/a/macros/.../exec">
    <div class="row" style="margin-top:8px">
      <button class="pri sm" data-a="savegas">儲存網址</button>
      <button class="sm" data-a="testgas">測試讀取雲端</button>
      <button class="sm" data-a="push">立即推送至雲端</button>
    </div>
    <p class="mut" style="margin:8px 0 0">提示：請填入部署為「網頁應用程式」後結尾為 <code>/exec</code> 的網址，不要填入 <code>/dev</code> 或 <code>/library</code> 網址。</p>
  </div>
  <div class="card">
    <h2>二、115學年度各年級班級數（4班或5班）</h2>
    ${[1, 2, 3, 4, 5, 6].map(g => {
      const c = y.classes[g];
      return `<div class="row" style="margin-bottom:6px">
        <b style="width:56px">${G[g]}年級</b>
        <select class="sm" style="width:90px" data-c="ccount" data-g="${g}">
          <option value="4" ${c.length == 4 ? "selected" : ""}>4 班</option>
          <option value="5" ${c.length == 5 ? "selected" : ""}>5 班</option>
        </select>
        <span class="mut">${c.map(esc).join("、")}</span>
      </div>`;
    }).join("")}
  </div>
  <div class="card">
    <h2>三、新增週次</h2>
    <div class="row">
      <input id="wn" type="number" min="1" class="sm" style="width:85px" placeholder="週次">
      <input id="wa" type="date" class="sm" style="width:150px">
      <input id="wb" type="date" class="sm" style="width:150px">
      <input id="wd" class="sm" style="width:110px" placeholder="正導護">
      <button class="pri sm" data-a="addweek">新增</button>
    </div>
  </div>`;
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-a]");
  if (!b) return;
  const a = b.dataset.a, v = b.dataset.v;

  if (a === "tab") { S.tab = v; render(); }
  else if (a === "grade") { S.grade = +v; S.cls = 0; render(); }
  else if (a === "round") { S.round = +v; render(); }
  else if (a === "award") { S.award = v; render(); }
  else if (a === "cls") { S.cls = +v; render(); }
  else if (a === "savegas") {
    cfg.gasUrl = ($("#gasUrlInput")?.value || "").trim();
    saveLocalAll();
    syncMsg = "✓ 已儲存雲端同步網址";
    render();
    alert("雲端同步網址已儲存！");
  }
  else if (a === "testgas") {
    cfg.gasUrl = ($("#gasUrlInput")?.value || "").trim();
    saveLocalAll();
    pullFromGas(true);
  }
  else if (a === "pull") { pullFromGas(false); }
  else if (a === "push") { pushToGas(true); }
  else if (a === "mark") {
    const r = curRec();
    r.marks[v] = (r.marks[v] || 0) + 1;
    if (!r.inspector) r.inspector = S.insp;
    recs[r.id] = r;
    scheduleAutoSave();
  }
  else if (a === "done") {
    const r = curRec();
    r.status = r.status === "done" ? "draft" : "done";
    if (!r.inspector) r.inspector = S.insp;
    recs[r.id] = r;
    scheduleAutoSave();
  }
  else if (a === "clear") {
    const r = curRec();
    r.marks = {};
    r.status = "draft";
    recs[r.id] = r;
    scheduleAutoSave();
  }
  else if (a === "draw") {
    const by = (S.insp || prompt("請輸入正導護教師姓名") || "").trim();
    if (!by) return;
    S.insp = by;
    const x = new Uint32Array(1);
    crypto.getRandomValues(x);
    dress[did(S.grade, S.cls)] = {
      id: did(S.grade, S.cls), year: S.year, sem: S.sem, week: S.week,
      grade: S.grade, cls: S.cls, item: DRESS[x[0] % DRESS.length],
      count: null, delta: null, status: "drawn", by
    };
    scheduleAutoSave();
  }
  else if (a === "dsave") {
    const r = dressOf(S.grade, S.cls);
    const n = parseInt($("#dcount")?.value, 10);
    if (!r || Number.isNaN(n) || n < 0 || n > 99) return alert("請輸入 0～99 的整數");
    r.count = n;
    r.delta = dscore(n);
    r.status = "done";
    r.by = S.insp || r.by;
    dress[r.id] = r;
    scheduleAutoSave();
  }
  else if (a === "unlock") {
    const r = dressOf(S.grade, S.cls);
    const by = (prompt("請輸入行政操作者姓名以解除鎖定：") || "").trim();
    if (!r || !by) return;
    r.status = "unlocked";
    r.unlockedBy = by;
    dress[r.id] = r;
    scheduleAutoSave();
  }
  else if (a === "addweek") {
    const no = +$("#wn")?.value, s = $("#wa")?.value, en = $("#wb")?.value, duty = ($("#wd")?.value || "").trim();
    if (!no || !s || !en || en < s) return alert("請填寫週次與正確起訖日期");
    const wid = "w" + S.year + "_" + S.sem + "_" + no + "_" + uid();
    cfg.years[S.year].weeks.push({ id: wid, sem: S.sem, no, start: s, end: en, duty });
    S.week = wid;
    scheduleAutoSave();
  }
});

document.addEventListener("change", e => {
  const t = e.target, c = t.dataset.c;
  if (!c) return;
  if (c === "year") { S.year = t.value; S.week = weeks()[0]?.id || ""; render(); }
  else if (c === "sem") { S.sem = t.value; S.week = weeks()[0]?.id || ""; render(); }
  else if (c === "week") { S.week = t.value; render(); }
  else if (c === "insp" || c === "dinsp") { S.insp = t.value.trim(); saveLocalAll(); }
  else if (c === "date") { const r = curRec(); r.date = t.value; recs[r.id] = r; scheduleAutoSave(); }
  else if (c === "ccount") {
    const g = +t.dataset.g, n = +t.value, l = cfg.years[S.year].classes[g];
    while (l.length < n) l.push(DEF[l.length] || "");
    l.length = n;
    scheduleAutoSave();
  }
});

(async () => {
  const lc = LS.g("tz_cfg");
  if (lc) cfg = { ...cfg, ...lc };
  recs = LS.g("tz_recs") || {};
  dress = LS.g("tz_dress") || {};
  results = LS.g("tz_results") || {};
  const sv = LS.g("tz_sel");
  if (sv) Object.assign(S, sv);
  ensureDefaultYear();
  render();
  if (cfg.gasUrl) pullFromGas(false);
})();
</script>
</body>
</html>
